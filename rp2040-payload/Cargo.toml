[package]
name = "rp2040-payload"
description = "no_std firmware for the RP2040, embedded into the flasher"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Standalone project, not a member of the root workspace.
[workspace]

[[bin]]
name = "rp2040-payload"
test = false
bench = false

[dependencies]
cortex-m = "0.7.9"
cortex-m-rt = "0.7.7"
embedded-hal = "1.0.0"
panic-halt = "1.0.0"
rp2040-boot2 = "0.3.0"
rp2040-hal = { version = "0.12.0", features = ["rt", "critical-section-impl"] }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
debug = 2
