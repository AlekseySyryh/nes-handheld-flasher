name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the crate versions
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          workspace_version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          payload_version=$(grep -m1 '^version' rp2040-payload/Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag_version workspace=$workspace_version payload=$payload_version"
          if [ "$tag_version" != "$workspace_version" ] || [ "$tag_version" != "$payload_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the versions in Cargo.toml"
            exit 1
          fi

      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace

      - name: Build
        run: cargo build --release -p flasher

      - name: Package
        shell: pwsh
        run: |
          $name = "rp2040-flasher-$env:GITHUB_REF_NAME-windows-x64"
          New-Item -ItemType Directory -Path "dist/$name" | Out-Null
          Copy-Item target/release/flasher.exe "dist/$name/flasher.exe"
          Copy-Item LICENSE "dist/$name/LICENSE"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "dist/$name.zip.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
